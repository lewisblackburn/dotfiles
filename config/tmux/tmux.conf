# tmux configuration.
#
# Linked to ~/.config/tmux/tmux.conf. Kept deliberately small: the bindings
# below are the ones that matter next to nvim, not a full re-skin.

# ---- prefix ---------------------------------------------------------------
# C-a is easier to reach than C-b and doesn't collide with anything in nvim.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- sane defaults --------------------------------------------------------
set -g mouse on
set -g base-index 1                 # windows start at 1 — 0 is a long reach
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10              # 0 breaks some terminals; 10ms is invisible
set -g focus-events on              # nvim's autoread needs these
set -g set-clipboard on

# True colour, so nvim's theme matches the one outside tmux.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc,alacritty:Tc"

# ---- splitting: open where you already are --------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- navigation -----------------------------------------------------------
# hjkl to move, HJKL to resize — same directions as smart-splits in nvim.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- copy mode: vi keys ---------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---- status line ----------------------------------------------------------
# Minimal, because starship already carries the context that matters.
set -g status-position top
set -g status-style "bg=default fg=colour244"
set -g status-left "#[fg=colour39,bold]#S #[default]"
set -g status-right "#[fg=colour244]%H:%M "
set -g window-status-current-style "fg=colour39,bold"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# Tinty writes this file from the tracked VS Code Dark 2026 Base24 scheme.
# It is optional so tmux remains usable before the first `dot install`.
if-shell '[ -f "$HOME/.local/share/tinted-theming/tinty/repos/tinted-tmux/colors/base24-vscode-dark-2026.conf" ]' \
  'source-file "$HOME/.local/share/tinted-theming/tinty/repos/tinted-tmux/colors/base24-vscode-dark-2026.conf"'
