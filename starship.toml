"$schema" = 'https://starship.rs/config-schema.json'

# Starship prompt, from the Gruvbox Rainbow preset.
# Segments, left to right: os + user, folder, git, language, docker, time.

add_newline = false   # keeps the collapsing prompt in .zshrc steady
palette = 'gruvbox_dark'

format = """
[](color_orange)$os$username\
[](bg:color_yellow fg:color_orange)$directory\
[](fg:color_yellow bg:color_aqua)$git_branch$git_status\
[](fg:color_aqua bg:color_blue)$java$kotlin$nodejs$bun$python$golang$rust\
[](fg:color_blue bg:color_bg3)$docker_context\
[](fg:color_bg3 bg:color_bg1)$time\
[ ](fg:color_bg1)\
$line_break$character"""

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_red = '#cc241d'
color_yellow = '#d79921'

# OS and user

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"

[os.symbols]
Macos = "󰀵 "
Linux = "󰌽 "
Ubuntu = "󰕈 "
Debian = "󰣚 "
Fedora = "󰣛 "
Arch = "󰣇 "

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[$user ]($style)'

# Folder

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Developer" = "󰲋 "

# Git

[git_branch]
symbol = ""
format = '[ $symbol $branch ](fg:color_fg0 bg:color_aqua)'

[git_status]
format = '[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)'

# Languages (only shown inside a project that uses them)

[java]
symbol = ""
format = '[ $symbol( $version) ](fg:color_fg0 bg:color_blue)'

[kotlin]
symbol = ""
format = '[ $symbol( $version) ](fg:color_fg0 bg:color_blue)'

[nodejs]
symbol = ""
format = '[ $symbol( $version) ](fg:color_fg0 bg:color_blue)'

[bun]
symbol = ""
format = '[ $symbol( $version) ](fg:color_fg0 bg:color_blue)'

[python]
symbol = ""
format = '[ $symbol( $version) ](fg:color_fg0 bg:color_blue)'

[golang]
symbol = ""
format = '[ $symbol( $version) ](fg:color_fg0 bg:color_blue)'

[rust]
symbol = ""
format = '[ $symbol( $version) ](fg:color_fg0 bg:color_blue)'

# Docker and time

[docker_context]
symbol = ""
format = '[ $symbol( $context) ](fg:#83a598 bg:color_bg3)'

[time]
disabled = false
time_format = "%R"
format = '[  $time ](fg:color_fg0 bg:color_bg1)'

# Second line

[line_break]
disabled = false

[character]
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
