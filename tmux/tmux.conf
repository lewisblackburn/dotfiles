# tmux config. Reload with prefix then r.
# Keys follow LazyVim where it has an equivalent.

# Prefix: ctrl+space, like LazyVim's space leader; leaves ctrl+a for the shell
unbind C-b
set -g prefix C-Space

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Colours: true colour and curly underlines, so nvim looks right inside tmux
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:usstyle"

# Tabs and splits open in the current folder; H/L like LazyVim buffers
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind H previous-window
bind L next-window
bind x kill-pane
bind C-l send-keys C-l

# Panes: ctrl+h/j/k/l with no prefix, like LazyVim windows.
# Inside nvim the keys pass through so it can move between its own splits.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
# alt+shift+h/j/k/l resizes (hold to repeat); inside nvim it resizes nvim's split.
bind -n M-H if-shell "$is_vim" "send-keys M-H" "resize-pane -L 5"
bind -n M-J if-shell "$is_vim" "send-keys M-J" "resize-pane -D 5"
bind -n M-K if-shell "$is_vim" "send-keys M-K" "resize-pane -U 5"
bind -n M-L if-shell "$is_vim" "send-keys M-L" "resize-pane -R 5"

# Copy mode: vi keys, plus the same pane moves
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Projects: prefix then f picks a folder from zoxide and opens its session
bind f display-popup -E -w 60% -h 50% 'sesh connect "$(sesh list -z | fzf --reverse)"'

# Status bar: tabs along the top in Gruvbox Dark, matching the prompt
set -g status-position top
set -g status-style "bg=default,fg=#928374"
set -g status-left "#[fg=#d65d0e,bold]#S  "
set -g status-left-length 30
set -g status-right ""
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#fbf1c7,bg=#d65d0e,bold] #I #W "
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d65d0e"
